<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Calculator</title>
  <style>
    html,body{
      height:100%;
      margin:0;
    }
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      background:#1e1e2f;
      font-family:'Segoe UI',sans-serif;
    }
    .calculator{
      width:300px;
      background:#2c2c3e;
      padding:20px;
      border-radius:20px;
      box-shadow:0 10px 25px rgba(0,0,0,.3);
    }
    .display{
      width:100%;
      height:60px;
      background:#000;
      color:#0f0;
      font-size:2rem;
      text-align:right;
      border:none;
      border-radius:10px;
      padding:10px;
      box-sizing:border-box;
      overflow-x:auto;
      caret-color:#0f0;
    }
    .buttons{
      margin-top:20px;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:15px;
    }
    button{
      height:60px;
      font-size:1.3rem;
      border:none;
      border-radius:12px;
      background:#444;
      color:#fff;
      cursor:pointer;
      transition:background .2s;
    }
    button:hover{background:#666}
    .operator{background:#ff9500}
    .equal{background:#00b894}
    .clear{background:#d63031}
    @media(max-width:400px){
      .calculator{width:260px}
      .display{font-size:1.6rem;height:50px}
      button{height:50px;font-size:1.1rem}
    }
  </style>
</head>
<body>

<div class="calculator">
  <input id="display" class="display" type="text" readonly>
  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="append('(')">(</button>
    <button onclick="append(')')">)</button>
    <button class="operator" onclick="append('/')">÷</button>
    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button class="operator" onclick="append('*')">×</button>
    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button class="operator" onclick="append('-')">−</button>
    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button class="operator" onclick="append('+')">+</button>
    <button onclick="append('0')">0</button>
    <button onclick="append('.')">.</button>
    <button onclick="backspace()">⌫</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>
</div>

<script>
  const display = document.getElementById('display');
  function updateCaret() {
    display.focus();
    const len = display.value.length;
    display.setSelectionRange(len, len);
    display.scrollLeft = display.scrollWidth;
  }
  function append(val) {
    display.value += val;
    updateCaret();
  }
  function clearDisplay() {
    display.value = '';
    updateCaret();
  }
  function backspace() {
    display.value = display.value.slice(0, -1);
    updateCaret();
  }
  function calculate() {
    try {
      display.value = eval(display.value) || '';
    } catch {
      display.value = 'Error';
    }
    updateCaret();
  }
  document.addEventListener('keydown', e => {
    const k = e.key;
    if ((k >= '0' && k <= '9') || "+-*/().".includes(k)) { append(k); }
    else if (k === 'Enter') { e.preventDefault(); calculate(); }
    else if (k === 'Backspace') { backspace(); }
    else if (k === 'Escape') { clearDisplay(); }
  });
  updateCaret();
</script>

</body>
</html>
